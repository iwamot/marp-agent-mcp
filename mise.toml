min_version = "2026.7.5"

[settings]
lockfile = true
npm.package_manager = "aube"

[env]
AUBE_ALLOWED_UNPOPULAR_PACKAGES = "pnpm-override-prune"

[tools]
biome = "2.5.8"
bun = "1.3.14"
node = "24.19.0"
"aqua:jdx/aube" = "1.40.0"
"npm:@marp-team/marp-cli" = "4.5.0"

[tools."npm:pnpm-override-prune"]
version = "0.0.8"
minimum_release_age = "0d"

[task_config]
includes = [
  "git::https://github.com/iwamot/mise-tasks.git//.mise/tasks?ref=v2.5.1",
]
