name: Oide

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/oide.yml

permissions: {}

jobs:
  pull:
    permissions:
      contents: read
    uses: iwamot/workflows/.github/workflows/oide.yml@866cf6089ddb88af6b479a14a4a78910b472b5f6 # v8.11.0
    with:
      SOURCES: |
        # renovate: datasource=github-tags depName=iwamot/repo-template
        iwamot/repo-template@v1.10.1
    secrets:
      OIDE_APP_CLIENT_ID: ${{ secrets.OIDE_APP_CLIENT_ID }}
      OIDE_APP_PRIVATE_KEY: ${{ secrets.OIDE_APP_PRIVATE_KEY }}
